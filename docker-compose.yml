services:
  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8080/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=vertex
      - DB_PASSWORD=vertex
      - DB_NAME=vertex_store
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=vertex123
      - ADMIN_SESSION_SECRET=vertex-local-admin-secret
      - ADMIN_SESSION_TTL_HOURS=8
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - mysql

  mysql:
    image: mysql:8.4
    environment:
      - MYSQL_DATABASE=vertex_store
      - MYSQL_USER=vertex
      - MYSQL_PASSWORD=vertex
      - MYSQL_ROOT_PASSWORD=vertex_root
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
